---
# Run with: ansible-playbook -i inventory.ini on-premises.yml --check
- name: Configure an on-premises application server
  hosts: app_servers
  become: true
  serial: 1
  tasks:
    - name: Install baseline packages
      ansible.builtin.package:
        name:
          - nginx
          - chrony
        state: present
    - name: Apply hardened SSH configuration
      ansible.builtin.template:
        src: templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        mode: '0600'
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart sshd
    - name: Confirm application health
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200
  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted
