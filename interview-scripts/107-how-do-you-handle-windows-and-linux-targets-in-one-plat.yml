- name: Execute question 107 solution
  hosts: all
  gather_facts: false
  tasks:
    - name: Validate input
      ansible.builtin.assert:
        that: inventory_hostname | length > 0
    - name: Apply idempotent solution
      ansible.builtin.debug:
        msg: "Implement question 107 for {{ inventory_hostname }}"
    - name: Verify result
      ansible.builtin.assert:
        that: true