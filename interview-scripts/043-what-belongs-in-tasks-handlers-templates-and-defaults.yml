      ansible.builtin.assert:
        that: inventory_hostname | length > 0
    - name: Apply idempotent solution
      ansible.builtin.debug:
        msg: "Implement question 43 for {{ inventory_hostname }}"
    - name: Verify result
      ansible.builtin.assert:
        that: true